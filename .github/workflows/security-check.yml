# レジストリのセキュリティ/完全性チェック。
# 全 PR で機械的チェックを強制する(docs/design/security.md S2)。
# ここが通っても「高権限アイテムは人間が読む」残余は消えない(S10 の天井)。
name: security-check

on:
  pull_request:
    paths:
      - 'public/registry/**'
      - 'scripts/**'
      - '.github/workflows/security-check.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # S4/R2-1: gitDates が壊れないよう完全な履歴を取る

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # S9/S11/S12: 正規テキスト・meta.id=dirname・SVG サニタイズ・サイズ上限
      - name: レジストリ完全性チェック
        run: node scripts/check-registry-integrity.mjs

      # S10 (一部): NoteDeck の契約スナップショットと配布物を機械照合
      # (capability id / endpoint 対応表 / Nd:on イベント / Plugin:register_* / 宣言 permissions)。
      # 詳細は docs/design/contract-check.md
      - name: 契約チェック (verify-contract)
        run: node scripts/verify-contract.mjs

      # 既存の必須フィールド + sha512 + frontmatter 検証
      - name: registry:build バリデーション
        run: pnpm run registry:build

      # S1/R1-C: 生成物 = ソースから決定的に導出できることを確認。
      # 有効化の前提として S4 のビルド決定化(index の updatedAt: now 除去)が必要。
      # それまでは差分を情報として出すに留め、fail させない(R2-1)。
      - name: 生成物とソースの乖離(情報)
        run: |
          if ! git diff --quiet; then
            echo "::warning::生成物に差分あり。ビルド決定化(S4)まではこの差分は許容。"
            git diff --stat || true
          fi

  # S10 の AST 権限導出は scripts/lib/derive-contract.mjs (verify-contract ステップ) で実装。
  # 第 1 引数が導出不能な呼び出し (Plugin:config 由来の宛先等) は warning に留めている。
  # TODO: unresolved を PR ラベル付与で人手レビュー導線に載せる (--strict 化はその後)。
